name: Publicar no GitHub Pages

# Todo push na main reconstrói e republica o site. Não há passo manual, e o
# dist/ não é versionado: o que vai ao ar é sempre o que este workflow gerou a
# partir do código, nunca um build esquecido na máquina de alguém.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes chegarem juntos, o segundo espera o primeiro terminar em vez
# de publicar por cima pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # A checagem de tipos roda antes do build: melhor o deploy falhar aqui do
      # que publicar uma página quebrada.
      - run: npm run lint

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
